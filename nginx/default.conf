server {
    listen 80;
    server_name localhost;

    # Hardening: Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Hardening: Bộ HTTP Security Headers theo chuẩn OWASP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:;" always;

    # Endpoint cung cấp metrics cho Nginx Prometheus Exporter
    location /stub_status {
        stub_status;
        allow all;
    }

    # Giao diện người dùng Frontend (SPA Web Dashboard)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # API Backend (RESTful API)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
    }

    # Metrics Endpoint cho Prometheus (Metrics ứng dụng CRM)
    location /metrics {
        proxy_pass http://backend:5000/metrics;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
    }
}
