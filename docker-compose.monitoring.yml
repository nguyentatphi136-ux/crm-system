services:
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: crm_nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://reverse-proxy:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - reverse-proxy
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: crm_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
      - frontend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: crm_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - backend_net

  grafana:
    image: grafana/grafana:latest
    container_name: crm_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana-dashboards:ro
      - crm_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: crm_cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - frontend_net

volumes:
  crm_grafana_data:
